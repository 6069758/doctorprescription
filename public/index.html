<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MedScript — Doctor Prescription System</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F0F4F8;
    --surface: #FFFFFF;
    --surface2: #F8FAFB;
    --border: #E2E8F0;
    --border2: #CBD5E1;
    --text: #0F172A;
    --text2: #475569;
    --text3: #94A3B8;
    --accent: #0070F3;
    --accent-light: #EBF4FF;
    --accent-dark: #0051B0;
    --green: #10B981;
    --green-light: #ECFDF5;
    --red: #EF4444;
    --red-light: #FEF2F2;
    --amber: #F59E0B;
    --amber-light: #FFFBEB;
    --purple: #8B5CF6;
    --purple-light: #F5F3FF;
    --sidebar-w: 240px;
    --header-h: 64px;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,.08);
    --shadow-lg: 0 12px 40px rgba(0,0,0,.12);
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Inter', system-ui, sans-serif; font-size: 14px; color: var(--text); background: var(--bg); }

  /* ─── AUTH ─── */
  #auth-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0070F3 0%, #0051B0 100%);
  }
  .auth-card {
    background: white; border-radius: 16px; padding: 48px;
    width: 100%; max-width: 420px; box-shadow: var(--shadow-lg);
  }
  .auth-logo { text-align: center; margin-bottom: 32px; }
  .auth-logo .logo-icon {
    width: 56px; height: 56px; background: var(--accent); border-radius: 14px;
    display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px;
  }
  .auth-logo .logo-icon svg { color: white; }
  .auth-logo h1 { font-size: 22px; font-weight: 700; color: var(--text); }
  .auth-logo p { color: var(--text2); font-size: 13px; margin-top: 4px; }
  .auth-tabs { display: flex; background: var(--bg); border-radius: 8px; padding: 4px; margin-bottom: 24px; }
  .auth-tab { flex: 1; padding: 8px; text-align: center; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 13px; color: var(--text2); transition: all .15s; }
  .auth-tab.active { background: white; color: var(--accent); box-shadow: var(--shadow); }

  /* ─── FORM ELEMENTS ─── */
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; letter-spacing: .02em; }
  .form-input, .form-select, .form-textarea {
    width: 100%; padding: 9px 12px; border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 13.5px; font-family: inherit; color: var(--text);
    background: var(--surface); transition: border-color .15s, box-shadow .15s; outline: none;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,112,243,.1);
  }
  .form-textarea { resize: vertical; min-height: 80px; }
  .form-row { display: grid; gap: 12px; }
  .form-row.cols-2 { grid-template-columns: 1fr 1fr; }
  .form-row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .form-row.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }

  /* ─── BUTTONS ─── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 8px; font-size: 13.5px; font-weight: 500;
    font-family: inherit; cursor: pointer; border: none; transition: all .15s; text-decoration: none;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1.5px solid var(--border2); }
  .btn-secondary:hover { background: var(--bg); }
  .btn-success { background: var(--green); color: white; }
  .btn-success:hover { background: #059669; }
  .btn-danger { background: var(--red); color: white; }
  .btn-danger:hover { background: #DC2626; }
  .btn-ghost { background: transparent; color: var(--text2); }
  .btn-ghost:hover { background: var(--bg); color: var(--text); }
  .btn-sm { padding: 5px 10px; font-size: 12.5px; }
  .btn-lg { padding: 11px 22px; font-size: 15px; }
  .btn-full { width: 100%; justify-content: center; }
  .btn-icon { padding: 7px; }

  /* ─── APP SHELL ─── */
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ─── SIDEBAR ─── */
  .sidebar {
    width: var(--sidebar-w); background: #0F172A; color: white;
    display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
    scrollbar-width: none;
  }
  .sidebar::-webkit-scrollbar { display: none; }
  .sidebar-header {
    padding: 20px 16px 16px; border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .sidebar-logo { display: flex; align-items: center; gap: 10px; }
  .sidebar-logo .logo-box {
    width: 36px; height: 36px; background: var(--accent); border-radius: 9px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .sidebar-logo .logo-text { font-weight: 700; font-size: 16px; }
  .sidebar-logo .logo-sub { font-size: 11px; color: rgba(255,255,255,.45); margin-top: 1px; }
  .sidebar-doctor {
    padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,.08);
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    transition: background .15s;
  }
  .sidebar-doctor:hover { background: rgba(255,255,255,.05); }
  .doc-avatar {
    width: 36px; height: 36px; border-radius: 50%; background: var(--accent);
    display: flex; align-items: center; justify-content: center; font-weight: 700;
    font-size: 14px; flex-shrink: 0; overflow: hidden;
  }
  .doc-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .doc-info { min-width: 0; }
  .doc-info .doc-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doc-info .doc-spec { font-size: 11px; color: rgba(255,255,255,.5); }
  .sidebar-nav { flex: 1; padding: 10px 8px; }
  .nav-section-label {
    font-size: 10.5px; font-weight: 600; color: rgba(255,255,255,.3); letter-spacing: .08em;
    padding: 12px 8px 6px; text-transform: uppercase;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px;
    border-radius: 8px; cursor: pointer; font-size: 13.5px; color: rgba(255,255,255,.65);
    transition: all .15s; margin-bottom: 1px;
  }
  .nav-item:hover { background: rgba(255,255,255,.07); color: white; }
  .nav-item.active { background: var(--accent); color: white; }
  .nav-item svg { flex-shrink: 0; }
  .sidebar-footer { padding: 12px; border-top: 1px solid rgba(255,255,255,.08); }

  /* ─── MAIN ─── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    height: var(--header-h); background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
    flex-shrink: 0; gap: 16px;
  }
  .topbar-title { font-size: 18px; font-weight: 700; }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  .page-content { flex: 1; overflow-y: auto; padding: 24px; }

  /* ─── CARDS ─── */
  .card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
  .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .card-title { font-size: 15px; font-weight: 600; }
  .card-body { padding: 20px; }

  /* ─── STATS ─── */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .stat-card {
    background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border);
    padding: 20px; display: flex; align-items: flex-start; gap: 14px; box-shadow: var(--shadow);
  }
  .stat-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .stat-body .stat-value { font-size: 26px; font-weight: 700; line-height: 1; }
  .stat-body .stat-label { font-size: 12px; color: var(--text2); margin-top: 4px; }
  .stat-body .stat-change { font-size: 11.5px; color: var(--green); margin-top: 6px; display: flex; align-items: center; gap: 3px; }

  /* ─── TABLES ─── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 11.5px; font-weight: 600; color: var(--text2); text-align: left; padding: 10px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13.5px; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }
  .td-actions { display: flex; align-items: center; gap: 6px; }

  /* ─── BADGES ─── */
  .badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 500; }
  .badge-blue { background: var(--accent-light); color: var(--accent); }
  .badge-green { background: var(--green-light); color: var(--green); }
  .badge-amber { background: var(--amber-light); color: #B45309; }
  .badge-purple { background: var(--purple-light); color: var(--purple); }
  .badge-red { background: var(--red-light); color: var(--red); }

  /* ─── SEARCH ─── */
  .search-wrap { position: relative; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text3); }
  .search-wrap input { padding-left: 34px; }

  /* ─── MODAL ─── */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1000;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal {
    background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg);
    width: 100%; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-sm { max-width: 480px; }
  .modal-md { max-width: 680px; }
  .modal-lg { max-width: 900px; }
  .modal-xl { max-width: 1100px; }
  .modal-header { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .modal-title { font-size: 16px; font-weight: 600; }
  .modal-body { padding: 22px; overflow-y: auto; flex: 1; }
  .modal-footer { padding: 16px 22px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-shrink: 0; }

  /* ─── TOAST ─── */
  #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: #1E293B; color: white; padding: 12px 18px; border-radius: 10px;
    font-size: 13.5px; box-shadow: var(--shadow-md); display: flex; align-items: center; gap: 10px;
    animation: slideInRight .25s ease; min-width: 240px;
  }
  .toast.success { border-left: 3px solid var(--green); }
  .toast.error { border-left: 3px solid var(--red); }
  @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* ─── PRESCRIPTION PAD ─── */
  .rx-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; }
  .rx-section-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .rx-section-title { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; }
  .rx-section-body { padding: 16px; }
  .medicine-row {
    display: grid; gap: 8px; align-items: start; padding: 12px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface2); position: relative;
    margin-bottom: 8px;
  }
  .medicine-row-top { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .medicine-row-fields { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .med-search-wrap { position: relative; }
  .med-dropdown {
    position: absolute; top: 100%; left: 0; right: 0; background: white;
    border: 1.5px solid var(--accent); border-radius: 8px; box-shadow: var(--shadow-md);
    z-index: 100; max-height: 220px; overflow-y: auto;
  }
  .med-dropdown-item {
    padding: 9px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .med-dropdown-item:last-child { border-bottom: none; }
  .med-dropdown-item:hover { background: var(--accent-light); }
  .med-dropdown-item .med-name { font-weight: 500; }
  .med-dropdown-item .med-form { font-size: 11.5px; color: var(--text2); }

  /* ─── PRINT PRESCRIPTION ─── */
  @media print {
    body * { visibility: hidden !important; }
    #print-area, #print-area * { visibility: visible !important; }
    #print-area { position: fixed; inset: 0; background: white; padding: 0; overflow: visible; }
  }
  .print-prescription {
    font-family: 'Times New Roman', serif; background: white;
    max-width: 800px; margin: 0 auto;
  }
  .print-header {
    border-bottom: 2px solid #1a1a2e; padding-bottom: 14px; margin-bottom: 14px;
    display: flex; align-items: flex-start; gap: 16px;
  }
  .print-logo { width: 70px; height: 70px; flex-shrink: 0; }
  .print-logo img { width: 100%; height: 100%; object-fit: contain; }
  .print-logo-placeholder {
    width: 70px; height: 70px; background: #f0f4f8; border: 1px solid #ddd;
    border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #666; text-align: center;
  }
  .print-doc-info h2 { font-size: 22px; font-weight: 700; color: #1a1a2e; }
  .print-doc-info .print-qual { font-size: 14px; color: #444; margin-top: 2px; }
  .print-doc-info .print-spec { font-size: 13px; color: #0070F3; font-weight: 600; margin-top: 2px; }
  .print-doc-info .print-contact { font-size: 12px; color: #555; margin-top: 4px; }
  .print-patient-bar {
    background: #1a1a2e; color: white; padding: 10px 16px; border-radius: 4px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px;
  }
  .print-patient-bar .pf { }
  .print-patient-bar .pf-label { font-size: 10px; opacity: .6; }
  .print-patient-bar .pf-val { font-size: 13px; font-weight: 600; }
  .print-vitals-bar {
    display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px;
    padding: 8px 0; border-bottom: 1px dashed #ccc;
  }
  .print-vital { }
  .print-vital .vl { font-size: 10.5px; color: #555; }
  .print-vital .vv { font-size: 13px; font-weight: 600; }
  .print-section-label { font-size: 12px; font-weight: 700; color: #1a1a2e; border-bottom: 1px solid #1a1a2e; margin-bottom: 8px; padding-bottom: 2px; }
  .print-complaint { font-size: 13.5px; margin-bottom: 12px; }
  .print-diagnosis { font-size: 14px; font-weight: 600; color: #1a1a2e; margin-bottom: 14px; }
  .print-rx-symbol { font-size: 26px; font-style: italic; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
  .print-med-row { display: grid; grid-template-columns: 28px 1fr; gap: 8px; margin-bottom: 10px; align-items: start; }
  .print-med-num { font-size: 13px; font-weight: 700; color: #1a1a2e; }
  .print-med-details { }
  .print-med-name { font-size: 14px; font-weight: 700; }
  .print-med-generic { font-size: 12px; color: #555; font-style: italic; }
  .print-med-dose { font-size: 12.5px; color: #333; margin-top: 2px; }
  .print-prec-list { margin-bottom: 12px; }
  .print-prec-item { font-size: 12.5px; padding-left: 12px; position: relative; margin-bottom: 3px; }
  .print-prec-item::before { content: '•'; position: absolute; left: 2px; }
  .print-footer { border-top: 1px solid #1a1a2e; margin-top: 20px; padding-top: 12px; display: flex; justify-content: flex-end; }
  .print-signature { text-align: center; }
  .print-signature .sig-box { width: 160px; height: 60px; border-bottom: 1px solid #333; margin-bottom: 4px; overflow: hidden; }
  .print-signature .sig-box img { max-height: 55px; }
  .print-signature .sig-label { font-size: 12px; font-weight: 700; }
  .print-signature .sig-reg { font-size: 11px; color: #555; }

  /* ─── EMPTY STATE ─── */
  .empty-state { text-align: center; padding: 48px 24px; color: var(--text2); }
  .empty-state svg { color: var(--text3); margin-bottom: 12px; }
  .empty-state h3 { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .empty-state p { font-size: 13.5px; }

  /* ─── PATIENT PROFILE ─── */
  .patient-header {
    background: linear-gradient(135deg, var(--accent) 0%, #0051B0 100%);
    border-radius: var(--radius); padding: 24px; color: white; margin-bottom: 20px;
    display: flex; align-items: center; gap: 20px;
  }
  .patient-avatar-lg {
    width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,.25);
    display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; flex-shrink: 0;
  }
  .patient-header-info h2 { font-size: 22px; font-weight: 700; }
  .patient-header-info p { font-size: 13.5px; opacity: .8; margin-top: 4px; }
  .patient-header-stats { display: flex; gap: 24px; margin-top: 12px; }
  .patient-header-stats .ph-stat { }
  .patient-header-stats .ph-stat-val { font-size: 20px; font-weight: 700; }
  .patient-header-stats .ph-stat-label { font-size: 11.5px; opacity: .7; }

  /* ─── TAGS ─── */
  .tags-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px;
    background: var(--accent-light); color: var(--accent); border-radius: 99px; font-size: 12.5px; cursor: pointer;
  }
  .tag.removable:hover { background: var(--red-light); color: var(--red); }
  .tag-available {
    display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px;
    background: var(--surface2); color: var(--text2); border: 1px solid var(--border); border-radius: 99px; font-size: 12.5px; cursor: pointer; transition: all .15s;
  }
  .tag-available:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }

  /* ─── MISC ─── */
  .divider { height: 1px; background: var(--border); margin: 16px 0; }
  .text-muted { color: var(--text2); }
  .text-sm { font-size: 12.5px; }
  .flex { display: flex; }
  .flex-between { display: flex; align-items: center; justify-content: space-between; }
  .items-center { align-items: center; }
  .gap-8 { gap: 8px; }
  .gap-12 { gap: 12px; }
  .mb-4 { margin-bottom: 4px; }
  .mb-8 { margin-bottom: 8px; }
  .mb-16 { margin-bottom: 16px; }
  .mb-20 { margin-bottom: 20px; }
  .hidden { display: none !important; }
  .icon-btn { background: none; border: none; cursor: pointer; color: var(--text2); padding: 5px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; transition: all .15s; }
  .icon-btn:hover { background: var(--bg); color: var(--text); }
  .icon-btn.danger:hover { background: var(--red-light); color: var(--red); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

  @media (max-width: 768px) {
    .sidebar { width: 200px; }
    :root { --sidebar-w: 200px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .form-row.cols-3, .form-row.cols-4 { grid-template-columns: 1fr 1fr; }
    .medicine-row-fields { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
      </div>
      <h1>MedScript</h1>
      <p>Professional Prescription Management</p>
    </div>
    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Sign In</div>
      <div class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Create Account</div>
    </div>

    <!-- LOGIN FORM -->
    <div id="login-form">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" id="login-email" placeholder="doctor@hospital.com" value="demo@medscript.in">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="login-password" placeholder="Enter password" value="demo1234">

<script>
// ═══════════════════════════════════════════════════════════════
//  DATA LAYER — localStorage per doctor
// ═══════════════════════════════════════════════════════════════
const DB = {
  getKey: (k) => `ms_${APP.currentUser?.id}_${k}`,
  get: (k, def = []) => { try { return JSON.parse(localStorage.getItem(DB.getKey(k))) ?? def; } catch { return def; } },
  set: (k, v) => localStorage.setItem(DB.getKey(k), JSON.stringify(v)),
  // Auth uses global keys
  getUsers: () => { try { return JSON.parse(localStorage.getItem('ms_users')) ?? []; } catch { return []; } },
  setUsers: (v) => localStorage.setItem('ms_users', JSON.stringify(v)),
  getCurrentUser: () => { try { return JSON.parse(localStorage.getItem('ms_current_user')); } catch { return null; } },
  setCurrentUser: (v) => localStorage.setItem('ms_current_user', JSON.stringify(v)),
  clearCurrentUser: () => localStorage.removeItem('ms_current_user'),
};

const APP = { currentUser: null, currentPage: 'dashboard', editingRxId: null };

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function today() { return new Date().toISOString().slice(0, 10); }
function fmtDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }); }
function initials(name) { return (name || '?').split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase(); }

// ═══════════════════════════════════════════════════════════════
//  AUTH
// ═══════════════════════════════════════════════════════════════
function switchAuthTab(t) {
  document.getElementById('tab-login').classList.toggle('active', t === 'login');
  document.getElementById('tab-register').classList.toggle('active', t === 'register');
  document.getElementById('login-form').classList.toggle('hidden', t !== 'login');
  document.getElementById('register-form').classList.toggle('hidden', t !== 'register');
}

function ensureDemoUser() {
  const users = DB.getUsers();
  if (!users.find(u => u.email === 'demo@medscript.in')) {
    const demo = {
      id: 'demo', email: 'demo@medscript.in', password: 'demo1234',
      name: 'Dr. Arjun Mehta', qualification: 'MBBS, MD (Internal Medicine)', specialization: 'General Physician',
      regNo: 'MCI-GUJ-78432', clinicName: 'Mehta Clinic & Diagnostics',
      address: '14, Civil Lines, Rajkot, Gujarat — 360001', phone: '+91 98765 43210',
      email2: 'dr.arjun.mehta@gmail.com', logo: '', signature: ''
    };
    users.push(demo);
    DB.setUsers(users);
  }
}

function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-password').value;
  const users = DB.getUsers();
  const user = users.find(u => u.email === email && u.password === pass);
  if (!user) { toast('Invalid email or password', 'error'); return; }
  APP.currentUser = user;
  DB.setCurrentUser(user);
  initApp();
}

function handleRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass = document.getElementById('reg-pass').value;
  if (!name || !email || !pass) { toast('Please fill all required fields', 'error'); return; }
  if (pass.length < 8) { toast('Password must be at least 8 characters', 'error'); return; }
  const users = DB.getUsers();
  if (users.find(u => u.email === email)) { toast('Email already registered', 'error'); return; }
  const user = {
    id: uid(), email, password: pass, name,
    qualification: document.getElementById('reg-qual').value.trim(),
    specialization: document.getElementById('reg-spec').value.trim(),
    regNo: document.getElementById('reg-regno').value.trim(),
    clinicName: '', address: '', phone: '', email2: email, logo: '', signature: ''
  };
  users.push(user);
  DB.setUsers(users);
  APP.currentUser = user;
  DB.setCurrentUser(user);
  initApp();
}

function handleLogout() {
  APP.currentUser = null;
  DB.clearCurrentUser();
  document.getElementById('auth-screen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  toast('Signed out successfully');
}

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
function initApp() {
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  updateSidebarProfile();
  seedDefaultData();
  navigateTo('dashboard');
}

function updateSidebarProfile() {
  const u = APP.currentUser;
  document.getElementById('sidebar-doc-name').textContent = u.name || 'Doctor';
  document.getElementById('sidebar-doc-spec').textContent = u.specialization || 'Physician';
  const av = document.getElementById('sidebar-avatar');
  if (u.logo) {
    av.innerHTML = `<img src="${u.logo}" alt="Logo">`;
  } else {
    av.textContent = initials(u.name);
  }
}

function seedDefaultData() {
  const meds = DB.get('medicines');
  if (!meds.length) {
    DB.set('medicines', [
      { id: uid(), name: 'Paracetamol', genericName: 'Acetaminophen', strength: '500mg', form: 'Tablet', dosage: '1 Tablet', frequency: 'Three times a day', duration: '5 days', instructions: 'After meals' },
      { id: uid(), name: 'Amoxicillin', genericName: 'Amoxicillin Trihydrate', strength: '500mg', form: 'Capsule', dosage: '1 Capsule', frequency: 'Twice a day', duration: '7 days', instructions: 'With food and water' },
      { id: uid(), name: 'Pantoprazole', genericName: 'Pantoprazole Sodium', strength: '40mg', form: 'Tablet', dosage: '1 Tablet', frequency: 'Once daily', duration: '14 days', instructions: 'Before breakfast on empty stomach' },

      { id: uid(), name: 'Azithromycin', genericName: 'Azithromycin Dihydrate', strength: '500mg', form: 'Tablet', dosage: '1 Tablet', frequency: 'Once daily', duration: '3 days', instructions: 'On empty stomach' },
      { id: uid(), name: 'Metformin', genericName: 'Metformin HCl', strength: '500mg', form: 'Tablet', dosage: '1 Tablet', frequency: 'Twice a day', duration: '30 days', instructions: 'After meals' },
      { id: uid(), name: 'Amlodipine', genericName: 'Amlodipine Besylate', strength: '5mg', form: 'Tablet', dosage: '1 Tablet', frequency: 'Once daily', duration: '30 days', instructions: 'At the same time each day' },
      { id: uid(), name: 'Cough Syrup', genericName: 'Dextromethorphan + Guaifenesin', strength: '100ml', form: 'Syrup', dosage: '10ml (2 teaspoons)', frequency: 'Three times a day', duration: '5 days', instructions: 'After meals. Shake well before use.' },
    ]);
  }
  const prec = DB.get('precautions');
  if (!prec.length) {
    DB.set('precautions', [
      { id: uid(), text: 'Take complete rest for 2-3 days' },
      { id: uid(), text: 'Drink plenty of fluids (2-3 liters/day)' },
      { id: uid(), text: 'Avoid cold and oily food' },
      { id: uid(), text: 'Do not self-medicate or stop medicines without consulting doctor' },
      { id: uid(), text: 'Avoid alcohol consumption during medication' },
      { id: uid(), text: 'Report immediately if symptoms worsen' },

  }

  if (!adv.length) {
    DB.set('advice', [
      { id: uid(), text: 'Follow up after 3 days if not improving' },

      { id: uid(), text: 'Monitor blood pressure daily at home' },
      { id: uid(), text: 'Maintain a healthy diet and exercise regularly' },
      { id: uid(), text: 'Get complete blood count (CBC) done' },
    ]);
  }

  if (!tmpl.length) {
    const medicines = DB.get('medicines');
    DB.set('templates', [
      {
        id: uid(), name: 'Fever & Cold', description: 'Common fever and cold treatment',
        medicines: medicines.slice(0, 2).map(m => ({ medId: m.id, name: m.name, genericName: m.genericName, strength: m.strength, form: m.form, dosage: m.dosage, frequency: m.frequency, duration: m.duration, instructions: m.instructions })),
        precautions: ['Take complete rest for 2-3 days', 'Drink plenty of fluids (2-3 liters/day)', 'Avoid cold and oily food'],
        advice: ['Follow up after 3 days if not improving']

    ]);
  }

const PAGE_TITLES = {
  'dashboard': 'Dashboard', 'patients': 'Patients', 'prescriptions': 'All Prescriptions',
  'new-rx': 'New Prescription', 'medicines': 'Medicine Database', 'templates': 'Prescription Templates',
  'precautions': 'Precautions', 'advice': 'Patient Advice', 'settings': 'Doctor Settings'
};

function navigateTo(page, params = {}) {
  APP.currentPage = page;
  APP.pageParams = params;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById(`nav-${page}`);
  if (navEl) navEl.classList.add('active');
  document.getElementById('page-title').textContent = PAGE_TITLES[page] || page;
  document.getElementById('topbar-actions').innerHTML = '';
  document.getElementById('page-content').innerHTML = '';
  const renders = {
    'dashboard': renderDashboard, 'patients': renderPatients, 'prescriptions': renderPrescriptions,
    'new-rx': renderNewRx, 'medicines': renderMedicines, 'templates': renderTemplates,
    'precautions': renderPrecautions, 'advice': renderAdvice, 'settings': renderSettings
  };
  (renders[page] || (() => {}))(params);
}

function renderPatientTable(q) {
  const patients = DB.get('patients');
  const rxList = DB.get('prescriptions');
  const filtered = q ? patients.filter(p => p.name?.toLowerCase().includes(q.toLowerCase()) || p.phone?.includes(q)) : patients;
  document.getElementById('patient-count').textContent = `${filtered.length} patient${filtered.length !== 1 ? 's' : ''}`;
  const tb = document.getElementById('patients-table');
  if (!filtered.length) {
    tb.innerHTML = `<div class="empty-state">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      <h3>${q ? 'No results found' : 'No patients yet'}</h3>
      <p>${q ? 'Try a different search term' : 'Add your first patient to get started'}</p>
    </div>`;
    return;
  }
  tb.innerHTML = `<table>
    <thead><tr><th>Patient Name</th><th>Age/Gender</th><th>Phone</th><th>Last Visit</th><th>Prescriptions</th><th>Actions</th></tr></thead>
    <tbody>
      ${filtered.sort((a,b)=>a.name?.localeCompare(b.name)).map(p => {
        const pRx = rxList.filter(r => r.patientId === p.id).sort((a,b) => b.date?.localeCompare(a.date));
        return `<tr>
          <td>
            <div style="display:flex;align-items:center;gap:10px;">
              <div style="width:34px;height:34px;border-radius:50%;background:var(--accent-light);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0;">${initials(p.name)}</div>
              <div>
                <div style="font-weight:500;">${p.name}</div>
                <div class="text-sm text-muted">${p.email || ''}</div>
              </div>
            </div>
          </td>
          <td>${p.age ? p.age+' yrs' : '—'} ${p.gender ? `<span class="badge ${p.gender==='Male'?'badge-blue':'badge-purple'}">${p.gender}</span>` : ''}</td>
          <td class="text-muted">${p.phone || '—'}</td>
          <td class="text-muted">${pRx[0] ? fmtDate(pRx[0].date) : 'Never'}</td>
          <td><span class="badge badge-green">${pRx.length} Rx</span></td>
          <td>
            <div class="td-actions">
              <button class="btn btn-secondary btn-sm" onclick="openPatient('${p.id}')">View</button>
              <button class="btn btn-primary btn-sm" onclick="newRxForPatient('${p.id}')">New Rx</button>
              <button class="icon-btn danger" title="Delete" onclick="deletePatient('${p.id}')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
              </button>
            </div>
          </td>
        </tr>`;
      }).join('')}
    </tbody>
  </table>`;
}

function filterPatients(q) { renderPatientTable(q); }

function deletePatient(id) {

  let patients = DB.get('patients').filter(p => p.id !== id);
  let rxList = DB.get('prescriptions').filter(r => r.patientId !== id);
  DB.set('patients', patients); DB.set('prescriptions', rxList);
  toast('Patient deleted'); renderPatients();
}

function openEditPatientModal(id) {
  const p = DB.get('patients').find(pt => pt.id === id);
  if (p) openAddPatientModal(p);
}

function savePatient(existingId) {
  const name = document.getElementById('pat-name').value.trim();
  if (!name) { toast('Patient name is required', 'error'); return; }
  const patients = DB.get('patients');
  if (existingId) {
    const idx = patients.findIndex(p => p.id === existingId);
    if (idx !== -1) {
      patients[idx] = { ...patients[idx], name, phone: v('pat-phone'), age: v('pat-age'), gender: v('pat-gender'), bloodGroup: v('pat-blood'), email: v('pat-email'), address: v('pat-address'), notes: v('pat-notes') };
      DB.set('patients', patients);
      toast('Patient updated'); closeModal('modal-patient');
      openPatient(existingId);
    }
  } else {
    const p = { id: uid(), name, phone: v('pat-phone'), age: v('pat-age'), gender: v('pat-gender'), bloodGroup: v('pat-blood'), email: v('pat-email'), address: v('pat-address'), notes: v('pat-notes'), createdAt: new Date().toISOString() };
    patients.push(p);
    DB.set('patients', patients);
    toast('Patient added'); closeModal('modal-patient');
    renderPatients();
  }
}

function v(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }

function renderPrescriptions() {
  const rxList = DB.get('prescriptions').sort((a,b) => b.createdAt?.localeCompare(a.createdAt));
  const patients = DB.get('patients');

  document.getElementById('topbar-actions').innerHTML = `<button class="btn btn-primary btn-sm" onclick="navigateTo('new-rx')">+ New Prescription</button>`;
  document.getElementById('page-content').innerHTML = `
    <div class="card">
      <div class="card-header">
        <div class="search-wrap" style="width:280px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input class="form-input" id="rx-search" placeholder="Search by patient or diagnosis…" oninput="filterRx(this.value)">
        </div>
        <span class="text-muted text-sm">${rxList.length} prescriptions</span>
      </div>
      <div id="rx-table-wrap"></div>
    </div>`;
  renderRxTable(rxList, patients);
}

function renderRxTable(rxList, patients) {
  const wrap = document.getElementById('rx-table-wrap');
  if (!rxList.length) {
    wrap.innerHTML = `<div class="empty-state"><h3>No prescriptions found</h3></div>`; return;
  }
  wrap.innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>Patient</th><th>Date</th><th>Diagnosis</th><th>Medicines</th><th>Actions</th></tr></thead>
    <tbody>
      ${rxList.map(rx => {
        const p = patients.find(pt => pt.id === rx.patientId);
        return `<tr>
          <td style="font-weight:500;">${rx.patientName || p?.name || '—'}</td>
          <td class="text-muted">${fmtDate(rx.date)}</td>
          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${rx.diagnosis || '—'}</td>
          <td><span class="badge badge-blue">${rx.medicines?.length || 0}</span></td>
          <td>
            <div class="td-actions">
              <button class="btn btn-secondary btn-sm" onclick="viewRx('${rx.id}')">View</button>
              <button class="btn btn-ghost btn-sm" onclick="printRx('${rx.id}')">Print</button>
              <button class="btn btn-ghost btn-sm" onclick="editRx('${rx.id}')">Edit</button>
              <button class="icon-btn danger" onclick="deleteRxFromList('${rx.id}')">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>
              </button>
            </div>
          </td>
        </tr>`;
      }).join('')}
    </tbody>
  </table></div>`;
}

function filterRx(q) {
  const rxList = DB.get('prescriptions').sort((a,b) => b.createdAt?.localeCompare(a.createdAt));
  const patients = DB.get('patients');
  const filtered = q ? rxList.filter(r => r.patientName?.toLowerCase().includes(q.toLowerCase()) || r.diagnosis?.toLowerCase().includes(q.toLowerCase())) : rxList;
  renderRxTable(filtered, patients);
}

function deleteRxFromList(id) {
  if (!confirm('Delete this prescription?')) return;
  DB.set('prescriptions', DB.get('prescriptions').filter(r => r.id !== id));
  toast('Deleted'); renderPrescriptions();
}

          <div class="rx-section-title">Advice to Patient</div>
          <button class="btn btn-secondary btn-sm" onclick="openAdvicePicker()">+ Add Advice</button>
        </div>
        <div class="rx-section-body">
          <div class="tags-list mb-8" id="rx-advice-tags"></div>
          <div class="form-group" style="margin-bottom:0;">

          </div>

function onPatientSelect(id) {
  if (!id) return;
  const p = DB.get('patients').find(pt => pt.id === id);
  if (!p) return;
  rxPatientId = id;
  document.getElementById('rx-pat-name').value = p.name || '';
  document.getElementById('rx-pat-age').value = p.age || '';
  document.getElementById('rx-pat-gender').value = p.gender || '';
  document.getElementById('rx-pat-phone').value = p.phone || '';
}

        </div>

function addManualMed() {
  rxMedicines.push({ name:'', genericName:'', strength:'', form:'', dosage:'', frequency:'', duration:'', instructions:'' });

}

function addMedFromDB() {
  const meds = DB.get('medicines');
  showModal('modal-med-pick', 'modal-md', 'Select Medicine', `
    <div class="search-wrap mb-16">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>

    <div id="med-pick-list">
      ${meds.map(m => `
        <div class="med-dropdown-item" style="border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;" onclick="selectMedFromDB('${m.id}')">
          <div>

        </div>`).join('')}

function filterMedPicker(q) {
  const meds = DB.get('medicines');
  const filtered = q ? meds.filter(m => m.name.toLowerCase().includes(q.toLowerCase()) || (m.genericName||'').toLowerCase().includes(q.toLowerCase())) : meds;
  document.getElementById('med-pick-list').innerHTML = filtered.map(m => `
    <div class="med-dropdown-item" style="border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;" onclick="selectMedFromDB('${m.id}')">
      <div>
        <div style="font-weight:600;">${m.name}</div>
        <div class="text-muted text-sm">${m.genericName||''} · ${m.strength||''} · ${m.form||''}</div>
        <div class="text-sm text-muted" style="margin-top:2px;">${m.dosage||''} — ${m.frequency||''} — ${m.duration||''}</div>
      </div>
    </div>`).join('') || '<p class="text-muted text-sm">No results</p>';
}

function selectMedFromDB(id) {
  const m = DB.get('medicines').find(med => med.id === id);
  if (!m) return;
  rxMedicines.push({ ...m });
  renderMedRow(rxMedicines.length - 1);
  closeModal('modal-med-pick');
}

function removeMed(idx) {
  rxMedicines.splice(idx, 1);
  // Re-render all
  const container = document.getElementById('rx-medicines-container');
  container.innerHTML = '';
  if (!rxMedicines.length) {
    container.innerHTML = `<div class="empty-state" style="padding:24px;" id="rx-meds-empty"><p class="text-muted">No medicines added.</p></div>`;
  } else {
    rxMedicines.forEach((_, i) => renderMedRow(i));
  }
}

function renderPrecTags() {
  const container = document.getElementById('rx-prec-tags');

  container.innerHTML = rxPrecautions.map((p, i) => `
    <div class="tag removable" onclick="removePrec(${i})">${p} <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>`).join('');
}

function renderAdviceTags() {

  container.innerHTML = rxAdvice.map((a, i) => `
    <div class="tag removable" onclick="removeAdvice(${i})">${a} <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>`).join('');
}

function removePrec(i) { rxPrecautions.splice(i, 1); renderPrecTags(); }
function removeAdvice(i) { rxAdvice.splice(i, 1); renderAdviceTags(); }

function addCustomPrec() {
  const inp = document.getElementById('rx-custom-prec');

}

function addCustomAdvice() {

  rxAdvice.push(val); renderAdviceTags(); inp.value = '';
}

    <div class="mb-16">

      <div style="display:flex;flex-direction:column;gap:6px;">

function applyPrecautions() {

function addCustomPrecFromModal() {

  const templates = DB.get('templates');
  if (!templates.length) { toast('No templates saved. Create templates in the Templates section.', 'error'); return; }
  showModal('modal-tmpl-pick', 'modal-md', 'Load Template', `
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${templates.map(t => `

             onmouseover="this.style.borderColor='var(--accent)';this.style.background='var(--accent-light)'" 
             onmouseout="this.style.borderColor='var(--border)';this.style.background=''"

          <div style="font-weight:600;margin-bottom:4px;">${t.name}</div>

    [{ label:'Cancel', class:'btn-secondary', action:'closeModal("modal-tmpl-pick")' }]);

function applyTemplate(id) {
  const t = DB.get('templates').find(x => x.id === id);
  if (!t) return;
  if (t.medicines?.length) {
    rxMedicines = [...(t.medicines || [])];
    const container = document.getElementById('rx-medicines-container');
    container.innerHTML = '';
    rxMedicines.forEach((_, i) => renderMedRow(i));
  }
  if (t.precautions?.length) { rxPrecautions = [...t.precautions]; renderPrecTags(); }
  if (t.advice?.length) { rxAdvice = [...t.advice]; renderAdviceTags(); }
  closeModal('modal-tmpl-pick');
  toast(`Template "${t.name}" loaded`);
}

function collectRxData() {
  // Sync current values from DOM
  rxMedicines.forEach((m, i) => {
    m.name = document.getElementById(`mr-name-${i}`)?.value || m.name;
    m.genericName = document.getElementById(`mr-generic-${i}`)?.value || m.genericName;
    m.strength = document.getElementById(`mr-strength-${i}`)?.value || m.strength;
    m.dosage = document.getElementById(`mr-dosage-${i}`)?.value || m.dosage;
    m.frequency = document.getElementById(`mr-freq-${i}`)?.value || m.frequency;
    m.duration = document.getElementById(`mr-dur-${i}`)?.value || m.duration;
    m.instructions = document.getElementById(`mr-inst-${i}`)?.value || m.instructions;
  });
  return {
    patientName: v('rx-pat-name'), patientAge: v('rx-pat-age'), patientGender: v('rx-pat-gender'),
    patientPhone: v('rx-pat-phone'), date: v('rx-date'), visitNo: v('rx-visit'),
    vitals: { weight: v('rx-weight'), bp: v('rx-bp'), pulse: v('rx-pulse'), temp: v('rx-temp'), spo2: v('rx-spo2'), height: v('rx-height') },
    complaints: v('rx-complaints'), diagnosis: v('rx-diagnosis'),
    medicines: [...rxMedicines], precautions: [...rxPrecautions], advice: [...rxAdvice],
    notes: v('rx-notes')
  };
}

function saveRx(andPrint = false) {
  const data = collectRxData();
  if (!data.patientName) { toast('Patient name is required', 'error'); return null; }

  // Auto-create patient if new name
  let patId = rxPatientId || document.getElementById('rx-patient-select')?.value;
  if (!patId) {
    const patients = DB.get('patients');
    let existing = patients.find(p => p.name.toLowerCase() === data.patientName.toLowerCase() && p.phone === data.patientPhone);
    if (!existing) {
      const newPat = { id: uid(), name: data.patientName, phone: data.patientPhone, age: data.patientAge, gender: data.patientGender, createdAt: new Date().toISOString() };
      patients.push(newPat); DB.set('patients', patients); patId = newPat.id;
    } else { patId = existing.id; }
  }

  const rxList = DB.get('prescriptions');
  let rxId;
  if (editingRxId) {
    const idx = rxList.findIndex(r => r.id === editingRxId);
    if (idx !== -1) { rxList[idx] = { ...rxList[idx], ...data, patientId: patId, updatedAt: new Date().toISOString() }; rxId = editingRxId; }
  } else {
    rxId = uid();
    rxList.push({ id: rxId, patientId: patId, ...data, createdAt: new Date().toISOString() });
  }
  DB.set('prescriptions', rxList);
  toast(editingRxId ? 'Prescription updated' : 'Prescription saved');
  if (andPrint) { printRx(rxId); }
  else { navigateTo('prescriptions'); }
  return rxId;
}

function saveAndPrintRx() { saveRx(true); }

      <div class="pf"><div class="pf-label">Phone</div><div class="pf-val">${rx.patientPhone || '—'}</div></div>
      <div class="pf"><div class="pf-label">Visit</div><div class="pf-val">${rx.visitNo || '1st'}</div></div>

    ${rx.diagnosis ? `<div style="margin-bottom:14px;"><div class="print-section-label">Diagnosis</div><div class="print-diagnosis">${rx.diagnosis}</div></div>` : ''}

          <option>Four times a day</option><option>Every 6 hours</option><option>Every 8 hours</option>
          <option>Once daily at night</option><option>Once daily in morning</option><option>As needed (SOS)</option>
        </datalist>
      </div>

      <div class="form-group"><label class="form-label">Default Instructions</label><input class="form-input" id="med-instr" value="${m.instructions||''}" placeholder="After meals"></div>

      { label: id ? 'Update' : 'Save Medicine', class:'btn-primary', action:`saveMed('${id||''}')` }
    ]);
}

function saveMed(existingId) {
  const name = v('med-name');
  if (!name) { toast('Medicine name required', 'error'); return; }
  const meds = DB.get('medicines');
  const obj = { name, genericName: v('med-generic'), strength: v('med-strength'), form: v('med-form'), dosage: v('med-dosage'), frequency: v('med-freq'), duration: v('med-duration'), instructions: v('med-instr') };
  if (existingId) {
    const idx = meds.findIndex(m => m.id === existingId);
    if (idx !== -1) meds[idx] = { ...meds[idx], ...obj };
  } else { meds.push({ id: uid(), ...obj }); }
  DB.set('medicines', meds); toast(existingId ? 'Medicine updated' : 'Medicine added'); closeModal('modal-med'); renderMedicines();
}

function deleteMed(id) {
  if (!confirm('Delete this medicine?')) return;
  DB.set('medicines', DB.get('medicines').filter(m => m.id !== id));

}

    ]);

  window._tmplMeds = t?.medicines ? [...t.medicines] : [];
}

function addMedToTemplate() {
  const sel = document.getElementById('tmpl-med-select');
  const id = sel.value;
  if (!id) return;
  const m = DB.get('medicines').find(x => x.id === id);
  if (!m) return;
  window._tmplMeds.push({ ...m });
  const list = document.getElementById('tmpl-meds-list');
  const i = window._tmplMeds.length - 1;
  list.insertAdjacentHTML('beforeend', `
    <div style="padding:10px;border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;gap:10px;margin-bottom:6px;" id="tmpl-med-${i}">
      <div style="flex:1;"><div style="font-weight:500;">${m.name} <span class="text-muted">${m.strength||''}</span></div>
      <div class="text-sm text-muted">${[m.dosage,m.frequency,m.duration].filter(Boolean).join(' · ')}</div></div>
      <button class="icon-btn danger" onclick="removeTmplMed(${i})">

      </button>
    </div>`);
  sel.value = '';
}

function removeTmplMed(i) {
  window._tmplMeds.splice(i, 1);
  const el = document.getElementById(`tmpl-med-${i}`);
  if (el) el.remove();
}

function saveTemplate(existingId) {
  const name = v('tmpl-name');
  if (!name) { toast('Template name required', 'error'); return; }
  const templates = DB.get('templates');
  const prec = (v('tmpl-prec') || '').split('\n').map(s => s.trim()).filter(Boolean);
  const advice = (v('tmpl-advice') || '').split('\n').map(s => s.trim()).filter(Boolean);
  const obj = { name, description: v('tmpl-desc'), medicines: window._tmplMeds || [], precautions: prec, advice };
  if (existingId) {
    const idx = templates.findIndex(t => t.id === existingId);
    if (idx !== -1) templates[idx] = { ...templates[idx], ...obj };
  } else { templates.push({ id: uid(), ...obj }); }
  DB.set('templates', templates); toast(existingId ? 'Template updated' : 'Template created'); closeModal('modal-tmpl'); renderTemplates();
}

function deleteTemplate(id) {
  if (!confirm('Delete this template?')) return;
  DB.set('templates', DB.get('templates').filter(t => t.id !== id));
  toast('Template deleted'); renderTemplates();
}

            <div>
              <div class="form-label mb-8">Clinic Logo</div>
              <div style="width:100px;height:100px;border:2px dashed var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;overflow:hidden;" id="logo-preview">
                ${u.logo ? `<img src="${u.logo}" style="width:100%;height:100%;object-fit:contain;">` : `<div class="text-muted text-sm" style="text-align:center;">No logo</div>`}
              </div>
              <input type="file" id="logo-file" accept="image/*" style="display:none;" onchange="handleLogoUpload(this)">
              <button class="btn btn-secondary btn-sm" onclick="document.getElementById('logo-file').click()">Upload Logo</button>
              ${u.logo ? `<button class="btn btn-ghost btn-sm" onclick="removeLogo()">Remove</button>` : ''}
            </div>
            <div>
              <div class="form-label mb-8">Signature</div>
              <div style="width:180px;height:70px;border:2px dashed var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;overflow:hidden;" id="sig-preview">
                ${u.signature ? `<img src="${u.signature}" style="max-height:65px;">` : `<div class="text-muted text-sm">No signature</div>`}
              </div>
              <input type="file" id="sig-file" accept="image/*" style="display:none;" onchange="handleSigUpload(this)">
              <button class="btn btn-secondary btn-sm" onclick="document.getElementById('sig-file').click()">Upload Signature</button>
              ${u.signature ? `<button class="btn btn-ghost btn-sm" onclick="removeSig()">Remove</button>` : ''}
            </div>
          </div>
        </div>
      </div>

      <div class="card mb-20">
        <div class="card-header"><div class="card-title">Account Security</div></div>
        <div class="card-body">
          <div class="form-row cols-2">
            <div class="form-group"><label class="form-label">Login Email</label><input class="form-input" value="${u.email}" disabled style="background:var(--surface2);color:var(--text2);"></div>
            <div class="form-group"><label class="form-label">New Password (leave blank to keep)</label><input class="form-input" id="set-pass" type="password" placeholder="New password (min 8 chars)"></div>
          </div>
        </div>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:10px;">
        <button class="btn btn-secondary" onclick="navigateTo('dashboard')">Cancel</button>
        <button class="btn btn-primary" onclick="saveSettings()">Save Settings</button>
      </div>
    </div>`;
}

function handleLogoUpload(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const data = e.target.result;
    document.getElementById('logo-preview').innerHTML = `<img src="${data}" style="width:100%;height:100%;object-fit:contain;">`;
    window._pendingLogo = data;
  };
  reader.readAsDataURL(file);
}

function handleSigUpload(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const data = e.target.result;
    document.getElementById('sig-preview').innerHTML = `<img src="${data}" style="max-height:65px;">`;
    window._pendingSig = data;
  };
  reader.readAsDataURL(file);
}

function removeLogo() { window._pendingLogo = ''; document.getElementById('logo-preview').innerHTML = '<div class="text-muted text-sm" style="text-align:center;">No logo</div>'; }
function removeSig() { window._pendingSig = ''; document.getElementById('sig-preview').innerHTML = '<div class="text-muted text-sm">No signature</div>'; }

function saveSettings() {
  const name = v('set-name');
  if (!name) { toast('Name is required', 'error'); return; }
  const users = DB.getUsers();
  const idx = users.findIndex(u => u.id === APP.currentUser.id);
  const updates = {
    name, qualification: v('set-qual'), specialization: v('set-spec'), regNo: v('set-regno'),
    clinicName: v('set-clinic'), address: v('set-address'), phone: v('set-phone'), email2: v('set-email2'),
  };
  if (window._pendingLogo !== undefined) updates.logo = window._pendingLogo;
  if (window._pendingSig !== undefined) updates.signature = window._pendingSig;
  const pass = v('set-pass');
  if (pass) { if (pass.length < 8) { toast('Password min 8 chars', 'error'); return; } updates.password = pass; }
  if (idx !== -1) { users[idx] = { ...users[idx], ...updates }; DB.setUsers(users); }
  APP.currentUser = { ...APP.currentUser, ...updates };
  DB.setCurrentUser(APP.currentUser);
  window._pendingLogo = undefined; window._pendingSig = undefined;
  updateSidebarProfile(); toast('Settings saved');
}

// ═══════════════════════════════════════════════════════════════
//  MODAL SYSTEM
// ═══════════════════════════════════════════════════════════════
function showModal(id, sizeClass, title, bodyHTML, buttons = []) {
  const existing = document.getElementById(id);
  if (existing) existing.remove();
  const btns = buttons.map(b => `<button class="btn ${b.class}" onclick="${b.action}">${b.label}</button>`).join('');
  const html = `
    <div class="modal-backdrop" id="${id}" onclick="onBackdropClick(event,'${id}')">
      <div class="modal ${sizeClass}">
        <div class="modal-header">
          <div class="modal-title">${title}</div>
          <button class="icon-btn" onclick="closeModal('${id}')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-body">${bodyHTML}</div>
        ${buttons.length ? `<div class="modal-footer">${btns}</div>` : ''}
      </div>
    </div>`;
  document.getElementById('modals').insertAdjacentHTML('beforeend', html);
}

function closeModal(id) { const el = document.getElementById(id); if (el) el.remove(); }
function onBackdropClick(e, id) { if (e.target.id === id) closeModal(id); }

// ═══════════════════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════════════════
function toast(msg, type = 'success') {
  const icons = { success: '✓', error: '✕' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${icons[type]||'ℹ'}</span><span>${msg}</span>`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ═══════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════
(function boot() {
  ensureDemoUser();
  const saved = DB.getCurrentUser();
  if (saved) {
    // Verify user still exists
    const users = DB.getUsers();
    const user = users.find(u => u.id === saved.id);
    if (user) { APP.currentUser = user; initApp(); return; }
  }
  document.getElementById('auth-screen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
})();
</script>
